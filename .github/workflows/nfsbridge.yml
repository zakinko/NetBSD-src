name: nfsbridge
on:
  push:
    branches: [nfsbridge]
    paths:
      - 'sys/nfs/**'
      - 'sys/oncrpc/**'
      - 'sys/fs/nfsv4/**'
      - 'sys/modules/nfsserver/**'
      - 'sys/rump/fs/lib/libnfsserver/**'
      - 'ci/nfsbridge/**'
      - '.github/workflows/nfsbridge.yml'
  workflow_dispatch:
concurrency:
  # By hand it is the heavy stage of another branch: its own group, so
  # that no push cancels it.
  group: nfsbridge-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
      - uses: actions/cache@v4
        with:
          path: nb/tools
          key: nfsbridge-tools-${{ hashFiles('ci/nfsv4/base') }}
      - name: The option off leaves sys/nfs as it was
        run: |
          sudo apt-get install -y -q unifdef >/dev/null
          B=$(cat ci/nfsbridge/base)
          if [ "$GITHUB_REF_NAME" = nfsacl ]; then B=$(cat ci/nfsacl/base); fi
          sh ci/nfsbridge/off-is-unchanged.sh "$B"
      - run: sh ci/nfsbridge/build.sh "$PWD/nb" "$PWD/out"
      # From its own base; nfsacl builds its series in nfsacl.yml.
      - name: Every commit on its own
        if: github.ref_name == 'nfsbridge'
        run: cp ci/nfsbridge/each-commit.sh nb/ && sh nb/each-commit.sh "$(cat ci/nfsbridge/base)" "$PWD/nb"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: out
          retention-days: 7
  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: ['on', 'off']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci/nfsbridge
            ci/oncrpc/swap.sh
      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out
      - uses: vmactions/netbsd-vm@v1
        with:
          release: '11.0'
          cpu: 2
          mem: 4096
          sync: rsync
          copyback: false
          run: uname -a
      - run: |
          M=$(echo ${{ matrix.mode }} | tr a-z A-Z)
          sh ci/oncrpc/swap.sh out/netbsd.${{ matrix.mode }} NFSBR$M ssh netbsd
      - run: |
          ssh netbsd 'mkdir -p /var/tmp/nfsbridge'
          tar -C out -cf - modules | ssh netbsd 'tar -C /var/tmp/nfsbridge -xf -'
          scp ci/nfsbridge/server.sh ci/nfsbridge/client.sh ci/nfsbridge/stopnfsd.sh ci/nfsbridge/rawrpc.c netbsd:/var/tmp/nfsbridge/
          ssh netbsd 'sh /var/tmp/nfsbridge/server.sh ${{ matrix.mode }}'
          # A panic leaves its backtrace in the buffer a warm boot keeps.
          ssh netbsd 'sysctl -w ddb.onpanic=1 ddb.tee_msgbuf=1; sysctl -w ddb.commandonenter="bt;show all locks;reboot"' || :
      - name: The NetBSD client
        shell: bash
        run: |
          ssh -o ServerAliveInterval=30 netbsd 'sh /var/tmp/nfsbridge/client.sh /var/tmp/nfsbridge' | tee out/client.txt
          test "${PIPESTATUS[0]}" = 0
      - name: The Linux client, versions 3 and 4 on the one port
        if: matrix.mode == 'on'
        run: |
          ssh -f -N -o ExitOnForwardFailure=yes -o ServerAliveInterval=10 \
              -L 2049:127.0.0.1:2049 -L 1234:127.0.0.1:1234 netbsd
          sleep 2
          sh ci/nfsbridge/linux.sh "$PWD/out"
      - name: What the kernel said
        if: always()
        run: |
          i=0; while [ $i -lt 24 ]; do
            ssh -o ConnectTimeout=10 netbsd true 2>/dev/null && break
            sleep 10; i=$((i + 1))
          done
          ssh -o ConnectTimeout=20 netbsd "uname -a; modstat | grep -E 'xdr|oncrpc|nfs'; ps -ax | grep -E 'nfs'; dmesg | grep -n -A60 -E 'panic|fatal|trap type' | head -150; dmesg | tail -40" | tee out/kernel.txt || echo no answer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.mode }}
          path: |
            out/client.txt
            out/linux.txt
            out/kernel.txt
          retention-days: 30
  atf:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: nb/tools
          key: nfsbridge-tools-${{ hashFiles('ci/nfsv4/base') }}
      # Saved by hand: the post step of actions/cache skips a failed job.
      - uses: actions/cache/restore@v4
        id: dest
        with:
          path: out-dest
          key: nfsbridge-dest-${{ hashFiles('sys/nfs/**', 'sys/oncrpc/**', 'sys/rump/fs/lib/libnfsserver/**', 'sys/rump/librump/rumpkern/lwproc.c', 'ci/nfsbridge/atf-build.sh') }}
      - if: steps.dest.outputs.cache-hit != 'true'
        run: |
          sh ci/nfsbridge/atf-build.sh "$PWD/nb" "$PWD/out-dest"
          rm -f out-dest/atf-build.log
      - uses: actions/cache/save@v4
        if: steps.dest.outputs.cache-hit != 'true'
        with:
          path: out-dest
          key: nfsbridge-dest-${{ hashFiles('sys/nfs/**', 'sys/oncrpc/**', 'sys/rump/fs/lib/libnfsserver/**', 'sys/rump/librump/rumpkern/lwproc.c', 'ci/nfsbridge/atf-build.sh') }}
      - uses: vmactions/netbsd-vm@v1
        with:
          release: '11.0'
          cpu: 2
          mem: 4096
          sync: rsync
          copyback: false
          run: uname -a
      - run: sh ci/oncrpc/swap.sh out-dest/netbsd.atf NFSBRON ssh netbsd
      - shell: bash
        run: |
          zstd -dc out-dest/dest.tar.zst | ssh netbsd 'mkdir -p /var/tmp/dest && tar -C /var/tmp/dest -xf -'
          scp ci/nfsbridge/atf-run.sh ci/nfsbridge/atf-chroot.sh netbsd:/var/tmp/
          ssh -o ServerAliveInterval=30 netbsd 'sh /var/tmp/atf-run.sh' | tee atf.txt
          test "${PIPESTATUS[0]}" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-atf
          path: atf.txt
          retention-days: 30

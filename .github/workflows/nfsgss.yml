# The push-time stage: the build, each commit built, the unit tests and,
# when the change is to the RPCSEC_GSS path, the Linux client under
# Kerberos.  ci/nfsgss/select.sh picks them from the files changed.  The
# rest (pynfs on every export, linux-client.sh, MIT krb5, FreeBSD) is
# nfsgss-heavy.yml, run by hand.
name: nfsgss
on:
  push:
    branches: [nfsgss]
    paths:
      - 'sys/fs/nfsv4/**'
      - 'sys/modules/nfsv4/**'
      - 'sys/oncrpc/**'
      - 'sys/kern/vfs_lockf.c'
      - 'sys/kern/vfs_vnops.c'
      - 'sys/kern/vfs_syscalls.c'
      - 'sys/kern/sys_descrip.c'
      - 'sys/sys/lockf.h'
      - 'sys/ufs/ffs/ffs_inode.c'
      - 'sys/fs/tmpfs/tmpfs_subr.c'
      - 'tests/fs/nfsv4/**'
      - 'tests/oncrpc/**'
      - 'ci/nfsv4/**'
      - 'sys/nfs/**'
      - 'ci/nfsgss/**'
      - 'usr.sbin/gssd/**'
      - 'usr.sbin/mountd/**'
      - '.github/workflows/nfsgss.yml'
      - '!ci/nfsgss/vm-mit.sh'
      - '!ci/nfsgss/freebsd.sh'
      - '!ci/nfsgss/pynfs-ssv.sh'
  workflow_dispatch:
concurrency:
  group: nfsgss-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      gss: ${{ steps.sel.outputs.gss }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 120
      - id: sel
        run: sh ci/nfsgss/select.sh '${{ github.event.before }}' | tee -a "$GITHUB_OUTPUT"
      # The kernel holds nothing of sys/fs/nfsv4, only the module does,
      # so it stays good across pushes until the base moves or what the
      # server needs of the kernel changes.  The tools outlast that.
      - uses: actions/cache/restore@v4
        id: tools
        with:
          path: nb/tools
          key: nfsv4-tools-${{ hashFiles('ci/nfsv4/base') }}
      - uses: actions/cache/restore@v4
        id: kernel
        with:
          path: nb/netbsd
          key: nfsgss-kernel-${{ hashFiles('sys/nfs/*', 'sys/oncrpc/*', 'sys/conf/files', 'ci/nfsv4/base', 'ci/nfsv4/build.sh', 'sys/kern/vfs_lockf.c', 'sys/kern/vfs_subr.c', 'sys/kern/vfs_vnops.c', 'sys/kern/vfs_syscalls.c', 'sys/kern/sys_descrip.c', 'sys/sys/lockf.h', 'sys/sys/vnode.h', 'sys/ufs/ffs/ffs_inode.c', 'sys/fs/tmpfs/tmpfs_subr.c') }}
      # The bridge's invariant: with NFSSERVER_ONCRPC off, sys/nfs is as at
      # its base cacd4b0 but for the include of the option's header.
      - name: sys/nfs with the option off
        run: |
          # unifdef from this tree, not apt: the archive did not resolve
          # from the runner in run 43042524113, and its index had gone
          # stale in 43033388367.
          mkdir -p "$HOME/bin" && cc -O -w -D__dead= -D"__printflike(a,b)=" -o "$HOME/bin/unifdef" usr.bin/unifdef/unifdef.c
          export PATH=$HOME/bin:$PATH
          git cat-file -e cacd4b0^{commit} 2>/dev/null || git fetch -q --depth=1 origin cacd4b0ecc01522a5e3f88160d8302dc97d29675
          sh ci/nfsbridge/off-is-unchanged.sh cacd4b0
      - run: sh ci/nfsv4/build.sh kernel "$PWD/nb" "$PWD/out"
      - uses: actions/cache/save@v4
        if: steps.tools.outputs.cache-hit != 'true'
        with:
          path: nb/tools
          key: nfsv4-tools-${{ hashFiles('ci/nfsv4/base') }}
      - uses: actions/cache/save@v4
        if: steps.kernel.outputs.cache-hit != 'true'
        with:
          path: nb/netbsd
          key: nfsgss-kernel-${{ hashFiles('sys/nfs/*', 'sys/oncrpc/*', 'sys/conf/files', 'ci/nfsv4/base', 'ci/nfsv4/build.sh', 'sys/kern/vfs_lockf.c', 'sys/kern/vfs_subr.c', 'sys/kern/vfs_vnops.c', 'sys/kern/vfs_syscalls.c', 'sys/kern/sys_descrip.c', 'sys/sys/lockf.h', 'sys/sys/vnode.h', 'sys/ufs/ffs/ffs_inode.c', 'sys/fs/tmpfs/tmpfs_subr.c') }}
      - run: sh ci/nfsv4/build.sh modules "$PWD/nb" "$PWD/out"
      - run: sh ci/nfsv4/each-commit.sh "$PWD/nb"
        env:
          EACH_BASE: ${{ steps.sel.outputs.base }}
      - if: steps.sel.outputs.xdr == 'true' || steps.sel.outputs.gssseq == 'true'
        run: sudo apt-get install -y -q libtirpc-dev >/dev/null
      - if: steps.sel.outputs.krb5 == 'true' || steps.sel.outputs.ssv == 'true'
        run: sudo apt-get install -y -q libssl-dev >/dev/null
      - name: t_nfsv4_xdr
        if: steps.sel.outputs.xdr == 'true'
        run: |
          mkdir -p t.inc && ln -s "$PWD/sys/fs" t.inc/fs
          cc -g -fsanitize=address,undefined -w -I/usr/include/tirpc -It.inc -o t tests/fs/nfsv4/t_nfsv4_xdr.c -ltirpc
          ./t
      - name: t_gss_seq
        if: steps.sel.outputs.gssseq == 'true'
        run: |
          mkdir -p t.inc2 && ln -s "$PWD/sys/oncrpc" t.inc2/oncrpc
          cc -g -fsanitize=address,undefined -w -I/usr/include/tirpc -It.inc2 -o t2 tests/oncrpc/t_gss_seq.c -ltirpc
          ./t2
      - name: t_gss_krb5
        if: steps.sel.outputs.krb5 == 'true'
        run: |
          cc -g -fsanitize=address,undefined -Wall -Isys/oncrpc -Itests/oncrpc/gss-shim -o t3 tests/oncrpc/t_gss_krb5.c sys/oncrpc/gss_krb5*.c -lcrypto
          ./t3
      - name: t_gss_ssv
        if: steps.sel.outputs.ssv == 'true'
        run: |
          cc -g -fsanitize=address,undefined -w -Isys/oncrpc -Itests/oncrpc/gss-shim -o t4 tests/oncrpc/t_gss_ssv.c sys/oncrpc/gss_ssv.c -lcrypto
          ./t4 | tail -3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: out
          retention-days: 7
  gss:
    needs: build
    if: needs.build.outputs.gss == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci/nfsv4
            ci/nfsgss
            ci/oncrpc/swap.sh
            sys/nfs/nfs.h
            sys/oncrpc/oncrpc_sec.h
            usr.sbin/mountd
            usr.sbin/gssd
      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out
      - uses: vmactions/netbsd-vm@v1
        with:
          release: '11.0'
          cpu: 2
          mem: 4096
          nat: |
            "18888": "8888"
          sync: rsync
          copyback: false
          run: uname -a
      - run: sh ci/oncrpc/swap.sh out/netbsd NFSV4T ssh netbsd
      - run: |
          tar -C out -cf - modules | ssh netbsd 'mkdir -p /var/tmp/nfsv4 && tar -C /var/tmp/nfsv4 -xf -'
          scp ci/nfsv4/in-vm.sh ci/nfsv4/nfsv4d.c ci/nfsv4/lockhold.c ci/nfsv4/restart.sh netbsd:/var/tmp/nfsv4/
          ssh netbsd 'sh /var/tmp/nfsv4/in-vm.sh'
      - name: The KDC and the daemons
        run: |
          tar -cf - sys/nfs/nfs.h sys/oncrpc/oncrpc_sec.h usr.sbin/mountd usr.sbin/gssd | ssh netbsd 'mkdir -p /var/tmp/nfsv4/src && tar -C /var/tmp/nfsv4/src -xf -'
          scp ci/nfsgss/vm-kdc.sh ci/nfsgss/desprobe.c ci/nfsgss/vm-des.sh netbsd:/var/tmp/nfsv4/
          ssh netbsd 'sh /var/tmp/nfsv4/vm-kdc.sh'
      - name: Linux under Kerberos
        run: sh ci/nfsgss/client.sh "$PWD/out"
      - name: What the kernel said
        if: always()
        run: |
          ssh -o ConnectTimeout=20 netbsd "uname -a; modstat | grep -E 'xdr|oncrpc|nfsv4'; dmesg | tail -40" | tee out/kernel.txt || echo no answer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gss
          path: |
            out/gss-client.txt
            out/rpc.gssd.log
            out/kernel.txt
            out/back.pcap
          retention-days: 30

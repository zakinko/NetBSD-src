# The pure parts in userland, on a push that touches them.
name: nfsrdma-unit
on:
  push:
    branches: [nfsrdma, nfsrdma2]
    paths:
      - 'sys/oncrpc/oncrpc_rdma.h'
      - 'sys/oncrpc/oncrpc_iwarp.h'
      - 'sys/oncrpc/oncrpc_rdma_hdr.c'
      - 'sys/oncrpc/oncrpc_rdma_chunk.c'
      - 'sys/oncrpc/oncrpc_rdma_nfs.c'
      - 'sys/oncrpc/oncrpc_iwarp_wire.c'
      - 'sys/fs/nfsv4/nfsv4_ulb.c'
      - 'sys/fs/nfsv4/nfsv4_xdr.[ch]'
      - 'sys/fs/nfsv4/nfsv4_proto.h'
      - 'tests/modules/t_oncrpc_rdma.c'
      - 'tests/fs/nfsv4/t_nfsv4_xdr.c'
      - '.github/workflows/nfsrdma-unit.yml'
concurrency:
  group: nfsrdma-unit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            sys/oncrpc
            sys/fs/nfsv4
            tests/modules
            tests/fs/nfsv4
      - run: |
          sudo apt-get install -y -q libtirpc-dev >/dev/null
          mkdir -p t.inc && ln -s "$PWD/sys/fs" t.inc/fs && ln -s "$PWD/sys/oncrpc" t.inc/oncrpc
          cc -g -fsanitize=address,undefined -Wall -Wno-unused -Wno-sign-compare -I/usr/include/tirpc -It.inc -o t tests/modules/t_oncrpc_rdma.c -ltirpc
          ./t
          cc -g -fsanitize=address,undefined -w -I/usr/include/tirpc -It.inc -o t2 tests/fs/nfsv4/t_nfsv4_xdr.c -ltirpc
          ./t2

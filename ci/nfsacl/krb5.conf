[libdefaults]
	default_realm = NFSGSS.TEST
	dns_lookup_kdc = false
	dns_canonicalize_hostname = false
	rdns = false
	udp_preference_limit = 1
	default_ccache_name = FILE:/var/tmp/krb5cc_%{uid}
[realms]
	NFSGSS.TEST = {
		kdc = 10.99.0.1:8888
	}
[domain_realm]
	.test = NFSGSS.TEST
	nfsgss-server.test = NFSGSS.TEST
